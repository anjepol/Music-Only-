<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f2c4a"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Reproductor">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Reproductor Musical</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<style>
:root{--bg-color-1:rgb(15,44,74);--bg-color-2:rgb(10,30,50);--glass-tint:rgba(255,255,255,.15);--glow-color:rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:400;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';overflow:hidden;width:1em;height:1em}
body{background-color:var(--bg-color-1);background-image:linear-gradient(135deg,var(--bg-color-1),var(--bg-color-2));height:100vh;height:100dvh;width:100vw;display:flex;justify-content:center;align-items:center;color:#fff;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background-color .8s ease}
.glass{background:var(--glass-tint);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 32px rgba(0,0,0,.2);transition:background .8s ease}
.icon-btn{cursor:pointer;transition:transform .2s ease,opacity .2s ease;text-shadow:0 4px 10px rgba(0,0,0,.1)}
.icon-btn:hover{transform:scale(1.08)}.icon-btn:active{transform:scale(.95);opacity:.8}
.icon-btn:focus-visible,.btn:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:8px}
.toggle{opacity:.45}.toggle.on{opacity:1}
.player-container{display:flex;width:90%;max-width:1000px;height:85vh;height:85dvh;max-height:450px;gap:40px;align-items:stretch}
.album-section{flex:1;display:flex;justify-content:center;align-items:center;min-width:0}
.album-cover{width:100%;max-width:450px;max-height:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;box-shadow:0 15px 45px var(--glow-color);background:rgba(255,255,255,.05);transition:box-shadow .8s ease}
.ui-section{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;min-width:0}
.status-bar{padding:6px 18px;border-radius:20px;font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:16px;margin-bottom:20px}
.status-bar .icon-btn{font-size:20px}
.main-player-card{width:100%;padding:35px 30px;border-radius:24px;display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px}
.track-info{margin-bottom:25px;width:100%}
.title{font-size:1.8rem;font-weight:800;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:1rem;font-weight:400;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-controls{display:flex;align-items:center;justify-content:center;gap:40px;margin-bottom:30px}
.media-controls .icon-btn{font-size:48px}.media-controls .play-btn{font-size:64px}
.progress-container{width:100%}
.progress-bar-bg{width:100%;height:8px;background:rgba(255,255,255,.3);border-radius:10px;position:relative;margin-bottom:12px;cursor:pointer;touch-action:none}
.progress-bar-bg::before{content:'';position:absolute;inset:-14px 0}
.progress-bar-fill{width:0;height:100%;background:#fff;border-radius:10px;position:absolute;left:0;top:0}
.progress-bar-fill::after{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.time-labels{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;letter-spacing:.5px}
.secondary-controls-card{padding:12px 36px;border-radius:20px;display:flex;gap:34px;justify-content:center}
.secondary-controls-card .icon-btn{font-size:32px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100;display:none;justify-content:center;align-items:center;opacity:0;transition:opacity .3s ease}
.modal-overlay.active{display:flex;opacity:1}
.modal-content{width:80%;max-width:800px;height:75vh;height:75dvh;padding:30px;border-radius:24px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:translateY(20px);transition:transform .3s ease}
.modal-overlay.active .modal-content{transform:none}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.2)}
.modal-body{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;justify-content:center;align-items:center;color:rgba(255,255,255,.7);text-align:center}
.modal-body.col{display:block;text-align:left;color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:.9rem;font-weight:600;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.22)}.btn .material-symbols-rounded{font-size:20px}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:1rem;user-select:text;-webkit-user-select:text}
.search::placeholder{color:rgba(255,255,255,.6)}
.note{opacity:.75;font-size:.85rem;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.1)}.row.now{background:rgba(255,255,255,.2)}
.row div{min-width:0}.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{opacity:.7}
.ln{font-size:1.5rem;font-weight:700;opacity:.4;padding:8px 0;text-align:center;cursor:pointer;transition:opacity .3s,transform .3s}.ln.on{opacity:1;transform:scale(1.05)}
.plain{white-space:pre-wrap;line-height:1.7;text-align:center;font-size:1.1rem;color:#fff}
#orientation-warning{position:fixed;inset:0;background:#050f1a;z-index:999;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px}
#orientation-warning .material-symbols-rounded{font-size:80px;margin-bottom:20px;animation:rot 2s infinite ease-in-out}
@keyframes rot{0%{transform:rotate(0)}50%,100%{transform:rotate(-90deg)}}
@media(orientation:portrait){#orientation-warning{display:flex}.player-container{display:none}}
@media(max-height:440px){.player-container{height:92dvh;gap:24px}.main-player-card{padding:16px 20px;margin-bottom:10px}.title{font-size:1.3rem}.track-info{margin-bottom:12px}.media-controls{gap:28px;margin-bottom:16px}.media-controls .icon-btn{font-size:38px}.media-controls .play-btn{font-size:52px}.status-bar{margin-bottom:8px}.secondary-controls-card{padding:6px 24px;gap:24px}.secondary-controls-card .icon-btn{font-size:28px}.modal-content{height:88dvh;padding:18px}.modal-header{margin-bottom:10px;padding-bottom:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div id="orientation-warning"><span class="material-symbols-rounded">screen_rotation</span><h2>Modo horizontal requerido</h2><p style="margin-top:10px;opacity:.8">Gira tu dispositivo para usar el reproductor.</p></div>
<div id="modalOverlay" class="modal-overlay"><div class="modal-content glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-header"><h2 id="modalTitle"></h2><span class="material-symbols-rounded icon-btn" id="closeModalBtn" aria-label="Cerrar">close</span></div>
<div class="modal-body" id="modalBody"></div></div></div>
<audio id="audio" preload="auto"></audio>
<div class="player-container">
<div class="album-section"><img id="albumCover" alt="Portada del álbum" class="album-cover"></div>
<div class="ui-section">
<div class="status-bar glass"><span id="systemTime">--:--</span><span id="batteryLevel">--%</span><span class="material-symbols-rounded icon-btn" id="fsBtn" aria-label="Pantalla completa (F)">fullscreen</span></div>
<div class="main-player-card glass">
<div class="track-info"><h1 class="title" id="trackTitle">--</h1><h2 class="artist" id="trackArtist">--</h2></div>
<div class="media-controls">
<span class="material-symbols-rounded icon-btn" id="prevBtn" aria-label="Anterior">fast_rewind</span>
<span class="material-symbols-rounded icon-btn play-btn" id="playBtn" aria-label="Reproducir">play_arrow</span>
<span class="material-symbols-rounded icon-btn" id="nextBtn" aria-label="Siguiente">fast_forward</span></div>
<div class="progress-container"><div class="progress-bar-bg" id="seekBar" role="slider" aria-label="Progreso"><div class="progress-bar-fill" id="progressBar"></div></div>
<div class="time-labels"><span id="timeStart">--:--</span><span id="timeEnd">--:--</span></div></div></div>
<div class="secondary-controls-card glass">
<span class="material-symbols-rounded icon-btn toggle" id="btnShuffle" aria-label="Aleatorio">shuffle</span>
<span class="material-symbols-rounded icon-btn toggle" id="btnRepeat" aria-label="Repetir">repeat</span>
<span class="material-symbols-rounded icon-btn" id="btnLyrics" aria-label="Letras">lyrics</span>
<span class="material-symbols-rounded icon-btn" id="btnPlaylist" aria-label="Lista de reproducción">format_list_bulleted</span>
<span class="material-symbols-rounded icon-btn" id="btnLibrary" aria-label="Biblioteca musical">library_music</span></div>
</div></div>
<script>
const $=id=>document.getElementById(id),audio=$('audio'),AUD=/\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|weba)$/i;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'--:--';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#1c3f66"/><g fill="#fff" fill-opacity=".35"><circle cx="160" cy="270" r="34"/><circle cx="250" cy="250" r="34"/><path d="M186 270V140l90-20v130h-26V150l-38 8v112z"/></g></svg>');
let lib=[],queue=[],idx=-1,shuffle=!!ls.get('shuf'),repeat=ls.get('rep')|0,dirs=[],pending=[],lyr={},lrcEls=[],li=-2,kind=null,mt,coverUrl,srcUrl,errs=0,fillList=()=>{};
const db=new Promise(r=>{try{const q=indexedDB.open('reproductor',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const kv=async(m,k,v)=>{const d=await db;if(!d)return;return new Promise(r=>{try{const s=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv'),q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch{r()}})};

/* Reloj y batería */
const tick=()=>{const n=new Date();$('systemTime').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};setInterval(tick,1000);tick();
navigator.getBattery?.().then(b=>{const u=()=>$('batteryLevel').textContent=Math.round(b.level*100)+'%';u();b.addEventListener('levelchange',u)}).catch(()=>{});

/* Modal */
function open(t,k){clearTimeout(mt);$('modalTitle').textContent=t;kind=k;const o=$('modalOverlay');o.style.display='flex';requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('active')))}
function closeModal(){kind=null;$('modalOverlay').classList.remove('active');mt=setTimeout(()=>$('modalOverlay').style.display='none',300)}
$('closeModalBtn').onclick=closeModal;$('modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')closeModal()};
const body=c=>{const b=$('modalBody');b.className='modal-body '+c;b.replaceChildren();return b};
const btn=(i,l,f)=>{const b=el('button','btn');b.append(el('span','material-symbols-rounded',i),l);b.onclick=f;return b};
const note=t=>{const n=$('libNote');if(n)n.textContent=t};
function rows(box,items,cb){box.replaceChildren();items.forEach(t=>{const now=t===queue[idx],r=el('div','row'+(now?' now':'')),d=el('div');d.append(el('b','',t.title),el('small','',t.artist+(t.album?' · '+t.album:'')));r.append(el('span','material-symbols-rounded',now?'equalizer':'music_note'),d);r.onclick=()=>cb(t);box.append(r)})}
function showQueue(){open('Lista de reproducción','queue');const b=body('col'),s=Math.max(0,idx-50),box=el('div');b.append(box);if(!queue.length)return b.append(el('p','note','La lista está vacía. Agrega música desde la biblioteca.'));rows(box,queue.slice(s,s+400),t=>load(queue.indexOf(t)));box.querySelector('.now')?.scrollIntoView({block:'center'})}
function showLibrary(){
  open('Biblioteca musical','library');const b=body('col'),bar=el('div','bar');
  bar.append(btn('create_new_folder','Agregar carpeta',addFolder),btn('audio_file','Agregar archivos',()=>inF.click()));
  if(pending.length)bar.append(btn('sync','Reconectar biblioteca',reconnect));
  if(dirs.length||lib.length)bar.append(btn('delete','Vaciar biblioteca',forget));
  const q=el('input','search');q.type='search';q.placeholder='Buscar canción, artista o álbum';q.setAttribute('aria-label','Buscar');
  const n=el('p','note');n.id='libNote';const box=el('div');b.append(bar,q,n,box);
  fillList=()=>{const s=q.value.trim().toLowerCase(),r=lib.filter(t=>!s||(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(s));
    n.textContent=lib.length?lib.length+' canciones'+(r.length>300?' · mostrando 300, usa el buscador':''):'Aún no hay música. Agrega una carpeta de tu dispositivo para empezar.';
    rows(box,r.slice(0,300),t=>{rebuild(t);load(idx);closeModal()})};
  q.oninput=fillList;fillList()}
function showLyrics(){
  open('Letras de la canción','lyrics');const b=body('col');li=-2;lrcEls=[];
  if(lyr.synced)lrcEls=lyr.synced.map(l=>{const d=el('p','ln',l.s||'♪');d.onclick=()=>audio.currentTime=l.t;b.append(d);return d});
  else if(lyr.plain)b.append(el('p','plain',lyr.plain));
  else b.append(el('p','note','Sin letra. Guarda un archivo .lrc con el mismo nombre junto al audio o incrústala en las etiquetas.'));
  sync()}
const refresh=()=>{if(kind==='lyrics')showLyrics();else if(kind==='queue')showQueue()};
function sync(){if(kind!=='lyrics'||!lyr.synced)return;const t=audio.currentTime+.2;let k=-1;while(k+1<lyr.synced.length&&lyr.synced[k+1].t<=t)k++;if(k===li)return;li=k;lrcEls.forEach((e,i)=>e.classList.toggle('on',i===k));lrcEls[k]?.scrollIntoView({block:'center',behavior:'smooth'})}
$('btnLyrics').onclick=showLyrics;$('btnPlaylist').onclick=showQueue;$('btnLibrary').onclick=showLibrary;

/* Etiquetas ID3v2 (mp3): título, artista, álbum, portada, letra */
const dec=(e,b)=>new TextDecoder(e===1?(b[0]===254?'utf-16be':'utf-16'):['iso-8859-1','','utf-16be','utf-8'][e]||'utf-8').decode(b).replace(/\0/g,'').trim();
const skip=(f,i,e)=>{if(e===1||e===2){while(i+1<f.length&&(f[i]||f[i+1]))i+=2;return i+2}while(i<f.length&&f[i])i++;return i+1};
async function tags(file,full){const o={};try{
  const h=new Uint8Array(await file.slice(0,10).arrayBuffer());if(h[0]!==73||h[1]!==68||h[2]!==51||h[3]<3)return o;
  const v=h[3],sz=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9],b=new Uint8Array(await file.slice(10,10+sz).arrayBuffer()),dv=new DataView(b.buffer);
  for(let p=0;p+10<=b.length;){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    const n=v===4?(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]:dv.getUint32(p+4),f=b.subarray(p+10,p+10+n),e=f[0];p+=10+n;
    if(id==='TIT2')o.title=dec(e,f.subarray(1));else if(id==='TPE1')o.artist=dec(e,f.subarray(1));else if(id==='TALB')o.album=dec(e,f.subarray(1));
    else if(full&&id==='USLT')o.lyrics=dec(e,f.subarray(skip(f,4,e)));
    else if(full&&id==='APIC'&&!o.cover){let i=1;while(f[i])i++;const m=String.fromCharCode(...f.subarray(1,i));i=skip(f,i+2,e);o.cover=new Blob([f.subarray(i)],{type:m.includes('/')?m:'image/jpeg'})}}
}catch{}return o}
async function meta(t,full){if(t.meta&&!full)return{};const r=await tags(t.file,full);t.meta=1;if(r.title)t.title=r.title;if(r.artist)t.artist=r.artist;if(r.album)t.album=r.album;return r}
let bg=0;async function bgMeta(){const id=++bg;for(let k=0;k<lib.length;k++){if(!lib[k].meta){await meta(lib[k]);if(id!==bg)return;if(k%100===99&&kind==='library')fillList()}}if(kind==='library')fillList()}

/* Biblioteca */
function ingest(items){
  const lrcs=new Map(),seen=new Set(lib.map(t=>t.key));let n=0;
  items.forEach(i=>{if(/\.lrc$/i.test(i.path))lrcs.set(i.path.replace(/\.lrc$/i,'').toLowerCase(),i.file)});
  for(const i of items){if(!(AUD.test(i.path)||i.file.type.startsWith('audio/')))continue;const key=i.path+'|'+i.file.size;if(seen.has(key))continue;seen.add(key);
    const base=i.file.name.replace(/\.[^.]+$/,''),m=base.match(/^(.+?)\s+-\s+(.+)$/);
    lib.push({key,file:i.file,path:i.path,title:m?m[2]:base,artist:m?m[1]:'Artista desconocido',album:'',lrc:lrcs.get(i.path.replace(/\.[^.]+$/,'').toLowerCase())});n++}
  lib.sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));return n}
function rebuild(first=queue[idx]){let q=lib.slice();if(shuffle){for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[q[i],q[j]]=[q[j],q[i]]}if(first){q=q.filter(t=>t!==first);q.unshift(first)}}queue=q;idx=first?q.indexOf(first):-1}
function done(){rebuild();if(idx<0&&queue.length)load(0,false);bgMeta();if(kind==='library')showLibrary();else refresh()}
async function walk(h,p,out){for await(const[n,e]of h.entries()){if(e.kind==='directory')await walk(e,p+n+'/',out);else if(AUD.test(n)||/\.lrc$/i.test(n))out.push({file:await e.getFile(),path:p+n})}}
async function scan(hs){const out=[];for(const h of hs){try{await walk(h,h.name+'/',out)}catch{}}const n=ingest(out);done();return n}
async function addFolder(){
  if(!window.showDirectoryPicker)return inD.click();
  try{const h=await showDirectoryPicker({id:'musica',startIn:'music'});
    for(const d of dirs)if(await d.isSameEntry(h))return note('Esa carpeta ya está agregada.');
    dirs.push(h);kv('put','dirs',dirs);note('Escaneando carpeta…');const n=await scan([h]);note(n+' canciones nuevas agregadas.')}
  catch(e){if(e.name!=='AbortError')inD.click()}}
async function reconnect(){const ok=[];for(const h of pending)try{if(await h.requestPermission({mode:'read'})==='granted')ok.push(h)}catch{}
  pending=pending.filter(h=>!ok.includes(h));note('Escaneando…');const n=await scan(ok);note(n+' canciones cargadas.')}
function forget(){audio.pause();audio.removeAttribute('src');audio.load();lib=[];queue=[];idx=-1;dirs=[];pending=[];kv('put','dirs',[]);
  $('trackTitle').textContent=$('trackArtist').textContent='--';$('timeStart').textContent=$('timeEnd').textContent='--:--';$('progressBar').style.width='0';setCover();showLibrary()}
const mk=d=>{const i=document.createElement('input');i.type='file';i.multiple=true;if(d)i.webkitdirectory=true;else i.accept='audio/*,.lrc,.flac,.opus,.m4a';
  i.onchange=()=>{const f=[...i.files];i.value='';const n=ingest(f.map(x=>({file:x,path:x.webkitRelativePath||x.name})));done();note(n+' canciones agregadas. Este navegador no las recordará al cerrar.')};return i};
const inF=mk(0),inD=mk(1);

/* Reproducción */
function setCover(b){if(coverUrl)URL.revokeObjectURL(coverUrl);coverUrl=b?URL.createObjectURL(b):null;$('albumCover').src=coverUrl||PH}
async function setLyrics(t,txt){let text=txt||'';if(t.lrc)try{text=await t.lrc.text()}catch{}if(queue[idx]!==t)return;
  const L=[];text.split(/\r?\n/).forEach(l=>{const s=l.replace(/\[[^\]]*\]/g,'').trim();[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)].forEach(m=>L.push({t:+m[1]*60+ +m[2],s}))});
  lyr={plain:text.trim(),synced:L.length?L.sort((a,b)=>a.t-b.t):null}}
async function load(i,play=true){
  if(i<0||i>=queue.length)return;idx=i;const t=queue[i],r=await meta(t,true);if(queue[idx]!==t)return;
  if(srcUrl)URL.revokeObjectURL(srcUrl);srcUrl=URL.createObjectURL(t.file);audio.src=srcUrl;

const toggle=()=>{if(!queue.length)return showLibrary();audio.paused?audio.play().catch(()=>{}):audio.pause()};
function next(manual){if(!queue.length)return;if(repeat===2&&!manual){audio.currentTime=0;return audio.play()}
  let i=idx+1;if(i>=queue.length){if(repeat===1||manual)i=0;else{audio.pause();audio.currentTime=0;return}}load(i)}

let wl;async function wake(on){try{if(on&&!wl){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>wl=null}else if(!on&&wl){wl.release();wl=null}}catch{}}
audio.onplay=audio.onpause=()=>{const p=!audio.paused,b=$('playBtn');b.textContent=p?'pause':'play_arrow';b.setAttribute('aria-label',p?'Pausar':'Reproducir');wake(p)};

const bar=$('seekBar');let drag=false;

addEventListener('keydown',e=>{const k=e.key,t=e.target;
  if(t.matches('input'))return;

  if(t.matches('button'))return;

/* Colores según la portada */
function updateUIColors(img){
  let c={r:15,g:44,b:74};
  try{const x=document.createElement('canvas').getContext('2d',{willReadFrequently:true});x.canvas.width=x.canvas.height=32;x.drawImage(img,0,0,32,32);
    const d=x.getImageData(0,0,32,32).data;let R=0,G=0,B=0,n=0;for(let i=0;i<d.length;i+=4)if(d[i+3]>128){R+=d[i];G+=d[i+1];B+=d[i+2];n++}
    if(n)c={r:R/n|0,g:G/n|0,b:B/n|0}}catch{}
  const s=document.documentElement.style,f=.45,m=v=>Math.floor(v*f);
  s.setProperty('--bg-color-1',`rgb(${m(c.r)},${m(c.g)},${m(c.b)})`);
  s.setProperty('--bg-color-2',`rgb(${Math.max(0,m(c.r)-25)},${Math.max(0,m(c.g)-25)},${Math.max(0,m(c.b)-25)})`);
  s.setProperty('--glass-tint',`rgba(${c.r},${c.g},${c.b},.25)`);s.setProperty('--glow-color',`rgba(${c.r},${c.g},${c.b},.6)`)}
$('albumCover').addEventListener('load',function(){updateUIColors(this)});$('albumCover').src=PH;

<body>
<div id="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div id="orientation-warning"><span class="material-symbols-rounded">screen_rotation</span><h2>Modo horizontal requerido</h2><p style="margin-top:10px;opacity:.8">Gira tu dispositivo para usar el reproductor.</p></div>
<div id="modalOverlay" class="modal-overlay"><div class="modal-content glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-header"><h2 id="modalTitle"></h2><span class="material-symbols-rounded icon-btn" id="closeModalBtn" aria-label="Cerrar">close</span></div>
<div class="modal-body" id="modalBody"></div></div></div>
<audio id="audio" preload="auto"></audio>
<div class="player-container">
<div class="album-section"><img id="albumCover" alt="Portada del álbum" class="album-cover"></div>
<div class="ui-section">
<div class="status-bar glass"><span id="systemTime">--:--</span><span id="batteryLevel">--%</span><span class="material-symbols-rounded icon-btn" id="fsBtn" aria-label="Pantalla completa (F)">fullscreen</span></div>
<div class="main-player-card glass">
<div class="track-info"><h1 class="title" id="trackTitle">--</h1><h2 class="artist" id="trackArtist">--</h2></div>
<div class="media-controls">
<span class="material-symbols-rounded icon-btn" id="prevBtn" aria-label="Anterior">fast_rewind</span>
<span class="material-symbols-rounded icon-btn play-btn" id="playBtn" aria-label="Reproducir">play_arrow</span>
<span class="material-symbols-rounded icon-btn" id="nextBtn" aria-label="Siguiente">fast_forward</span></div>
<div class="progress-container"><div class="progress-bar-bg" id="seekBar" role="slider" aria-label="Progreso"><div class="progress-bar-fill" id="progressBar"></div></div>

<div class="secondary-controls-card glass">
<span class="material-symbols-rounded icon-btn toggle" id="btnShuffle" aria-label="Aleatorio">shuffle</span>
<span class="material-symbols-rounded icon-btn toggle" id="btnRepeat" aria-label="Repetir">repeat</span>
<span class="material-symbols-rounded icon-btn" id="btnLyrics" aria-label="Letras">lyrics</span>
<span class="material-symbols-rounded icon-btn" id="btnPlaylist" aria-label="Lista de reproducción">format_list_bulleted</span>
<span class="material-symbols-rounded icon-btn" id="btnLibrary" aria-label="Biblioteca musical">library_music</span></div>
</div></div>
<script>
const $=id=>document.getElementById(id),audio=$('audio'),AUD=/\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|weba)$/i,IMG=/\.(jpe?g|png|webp)$/i;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const anim=(e,c)=>{e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'--:--';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#1c3f66"/><g fill="#fff" fill-opacity=".5"><circle cx="160" cy="270" r="34"/><circle cx="250" cy="250" r="34"/><path d="M186 270V140l90-20v130h-26V150l-38 8v112z"/></g></svg>');
let lib=[],queue=[],base=[],idx=-1,shuffle=false,loading=false,inAlbum=false,repeat=ls.get('rep')|0,dirs=[],pending=[],lyr={},lrcEls=[],li=-2,kind=null,mt,coverUrl,srcUrl,errs=0,fillList=()=>{};
const db=new Promise(r=>{try{const q=indexedDB.open('reproductor',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const kv=async(m,k,v)=>{const d=await db;if(!d)return;return new Promise(r=>{try{const s=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv'),q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch{r()}})};

/* Reloj y batería */
const tick=()=>{const n=new Date();$('systemTime').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};setInterval(tick,1000);tick();
navigator.getBattery?.().then(b=>{const u=()=>$('batteryLevel').textContent=Math.round(b.level*100)+'%';u();b.addEventListener('levelchange',u)}).catch(()=>{});

/* Modal */
function open(t,k){clearTimeout(mt);$('modalTitle').textContent=t;kind=k;const o=$('modalOverlay');o.style.display='flex';requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('active')))}
function closeModal(){kind=null;$('modalOverlay').classList.remove('active');mt=setTimeout(()=>$('modalOverlay').style.display='none',300)}
$('closeModalBtn').onclick=closeModal;$('modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')closeModal()};
const body=c=>{const b=$('modalBody');b.className='modal-body '+c;b.replaceChildren();return b};
const btn=(i,l,f)=>{const b=el('button','btn');b.append(el('span','material-symbols-rounded',i),l);b.onclick=f;return b};
const note=t=>{const n=$('libNote');if(n)n.textContent=t};
function rows(box,items,cb){box.replaceChildren();items.forEach(t=>{const now=t===queue[idx],r=el('div','row'+(now?' now':'')),d=el('div');d.append(el('b','',t.title),el('small','',t.artist+(t.album?' · '+t.album:'')));r.append(el('span','material-symbols-rounded',now?'equalizer':'music_note'),d);r.onclick=()=>cb(t);box.append(r)})}
function showQueue(){open('Lista de reproducción','queue');const b=body('col');
  if(!queue.length){b.append(el('p','note','La cola está vacía. Elige un álbum o mezcla tus canciones desde la biblioteca.'),btn('library_music','Ir a la biblioteca',()=>showLibrary()));return}
  const box=el('div'),s=Math.max(0,idx-50);b.append(box);rows(box,queue.slice(s,s+400),t=>load(queue.indexOf(t)));box.querySelector('.now')?.scrollIntoView({block:'center'})}
const ib=(i,l,f)=>{const s=el('span','material-symbols-rounded icon-btn',i);s.setAttribute('role','button');s.tabIndex=0;s.setAttribute('aria-label',l);s.title=l;s.onclick=e=>{e.stopPropagation();f()};return s};
const go=(t,f,m)=>{play(t,f,m);closeModal()};
function groups(){const m=new Map();
  lib.forEach(t=>{const k=t.dir+'|'+t.album.toLowerCase();let g=m.get(k);if(!g)m.set(k,g={album:t.album,tracks:[],artists:new Set()});g.tracks.push(t);g.artists.add(t.artist)});
  const a=[...m.values()];a.forEach(g=>{g.artist=g.artists.size>1?'Varios artistas':[...g.artists][0];g.tracks.sort((x,y)=>(x.no||999)-(y.no||999)||x.path.localeCompare(y.path,undefined,{numeric:true}))});
  return a.sort((x,y)=>x.artist.localeCompare(y.artist,'es')||x.album.localeCompare(y.album,'es'))}
function showLibrary(){
  inAlbum=false;open('Biblioteca musical','library');const b=body('col'),bar=el('div','bar');
  bar.append(btn('create_new_folder','Agregar carpeta',addFolder),btn('audio_file','Agregar archivos',()=>inF.click()));
  if(lib.length)bar.append(btn('shuffle','Mezclar todo',()=>go(lib,null,1)));
  if(pending.length)bar.append(btn('sync','Reconectar biblioteca',reconnect));
  if(lib.length)bar.append(btn('delete','Vaciar biblioteca',forget));
  const q=el('input','search');q.type='search';q.placeholder='Buscar álbum, artista o canción';q.setAttribute('aria-label','Buscar');
  const n=el('p','note');n.id='libNote';const box=el('div');b.append(bar,q,n,box);
  fillList=()=>{const s=q.value.trim().toLowerCase(),gs=groups().filter(g=>!s||(g.artist+' '+g.album+' '+g.tracks.map(t=>t.title).join(' ')).toLowerCase().includes(s));
    n.textContent=lib.length?gs.length+' álbumes · '+lib.length+' canciones'+(loading?' · leyendo etiquetas…':'')+(gs.length>200?' · usa el buscador':''):'Aún no hay música. Agrega una carpeta de tu dispositivo para empezar.';
    box.replaceChildren();let last;
    gs.slice(0,200).forEach(g=>{
      if(g.artist!==last){last=g.artist;const h=el('div','ah');h.append(el('b','',g.artist),ib('shuffle','Mezclar artista',()=>go(lib.filter(t=>t.artist===g.artist),null,1)));box.append(h)}
      const r=el('div','row'),d=el('div');d.append(el('b','',g.album),el('small','',g.tracks.length+' canciones'));
      r.append(el('span','material-symbols-rounded','album'),d,ib('play_arrow','Reproducir álbum',()=>go(g.tracks,g.tracks[0])),ib('shuffle','Mezclar álbum',()=>go(g.tracks,null,1)));
      r.onclick=()=>showAlbum(g);box.append(r)})};
  q.oninput=fillList;fillList()}
function showAlbum(g){
  inAlbum=true;open(g.album,'library');const b=body('col'),bar=el('div','bar');
  bar.append(btn('arrow_back','Biblioteca',()=>showLibrary()),btn('play_arrow','Reproducir álbum',()=>go(g.tracks,g.tracks[0])),btn('shuffle','Mezclar álbum',()=>go(g.tracks,null,1)));
  const box=el('div');b.append(bar,el('p','note',g.artist+' · '+g.tracks.length+' canciones'),box);rows(box,g.tracks,t=>go(g.tracks,t))}
function showLyrics(){
  open('Letras de la canción','lyrics');const b=body('col');li=-2;lrcEls=[];
  if(lyr.synced)lrcEls=lyr.synced.map(l=>{const d=el('p','ln',l.s||'♪');d.onclick=()=>audio.currentTime=l.t;b.append(d);return d});

const refresh=()=>{if(kind==='lyrics')showLyrics();else if(kind==='queue')showQueue()};
function sync(){if(kind!=='lyrics'||!lyr.synced)return;const t=audio.currentTime+.2;let k=-1;while(k+1<lyr.synced.length&&lyr.synced[k+1].t<=t)k++;if(k===li)return;li=k;lrcEls.forEach((e,i)=>e.classList.toggle('on',i===k));lrcEls[k]?.scrollIntoView({block:'center',behavior:'smooth'})}
$('btnLyrics').onclick=showLyrics;$('btnPlaylist').onclick=showQueue;$('btnLibrary').onclick=showLibrary;

/* Etiquetas ID3v2 (mp3): título, artista, álbum, portada, letra */
const dec=(e,b)=>new TextDecoder(e===1?(b[0]===254?'utf-16be':'utf-16'):['iso-8859-1','','utf-16be','utf-8'][e]||'utf-8').decode(b).replace(/\0/g,'').trim();

async function id3(file,full){const o={};try{
  const h=new Uint8Array(await file.slice(0,10).arrayBuffer());if(h[0]!==73||h[1]!==68||h[2]!==51||h[3]<3)return o;
  const v=h[3],sz=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9],b=new Uint8Array(await file.slice(10,10+sz).arrayBuffer()),dv=new DataView(b.buffer);
  for(let p=0;p+10<=b.length;){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    const n=v===4?(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]:dv.getUint32(p+4),f=b.subarray(p+10,p+10+n),e=f[0];p+=10+n;
    if(id==='TIT2')o.title=dec(e,f.subarray(1));else if(id==='TPE1')o.artist=dec(e,f.subarray(1));else if(id==='TALB')o.album=dec(e,f.subarray(1));else if(id==='TRCK')o.no=parseInt(dec(e,f.subarray(1)))||0;
    else if(full&&id==='USLT')o.lyrics=dec(e,f.subarray(skip(f,4,e)));

async function tags(file,full){const h=new Uint8Array(await file.slice(0,12).arrayBuffer()),a=String.fromCharCode(...h.subarray(0,4));

async function flac(file,full){const o={};try{let p=4;

          if(key==='TITLE')o.title=v;else if(key==='ARTIST')o.artist=v;else if(key==='ALBUM')o.album=v;else if(key==='TRACKNUMBER')o.no=parseInt(v)||0;else if(full&&(key==='LYRICS'||key==='UNSYNCEDLYRICS'))o.lyrics=v}}
      else if(!o.cover){let q=4;const ml=dv.getUint32(q);q+=4;const mime=String.fromCharCode(...b.subarray(q,q+ml));q+=ml;q+=4+dv.getUint32(q)+16;const L=dv.getUint32(q);q+=4;o.cover=new Blob([b.subarray(q,q+L)],{type:mime.includes('/')?mime:'image/jpeg'})}}

async function mp4(file,full){const o={};try{
  let p=0,mv;while(p<file.size){const h=new DataView(await file.slice(p,p+16).arrayBuffer());let z=h.getUint32(0);const ty=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));if(z===1)z=Number(h.getBigUint64(8));if(z<8)break;if(ty==='moov'){mv=[p,z];break}p+=z}
  if(!mv)return o;const b=new Uint8Array(await file.slice(mv[0],mv[0]+mv[1]).arrayBuffer()),dv=new DataView(b.buffer),u=new TextDecoder();
  const at=(s,e)=>{const r=[];while(s+8<=e){const z=dv.getUint32(s);if(z<8)break;r.push([String.fromCharCode(b[s+4],b[s+5],b[s+6],b[s+7]),s+8,Math.min(s+z,e)]);s+=z}return r},get=(s,e,t)=>at(s,e).find(a=>a[0]===t);
  const ud=get(8,b.length,'udta'),me=ud&&get(ud[1],ud[2],'meta'),il=me&&get(me[1]+4,me[2],'ilst');
  if(il)at(il[1],il[2]).forEach(([k,s,e])=>{const d=get(s,e,'data');if(!d)return;const v=b.subarray(d[1]+8,d[2]);
    if(k==='\xa9nam')o.title=u.decode(v);else if(k==='\xa9ART')o.artist=u.decode(v);else if(k==='\xa9alb')o.album=u.decode(v);else if(k==='trkn')o.no=(v[2]<<8)|v[3];
    else if(full&&k==='\xa9lyr')o.lyrics=u.decode(v);else if(full&&k==='covr'&&!o.cover)o.cover=new Blob([v],{type:v[0]===137?'image/png':'image/jpeg'})})

async function meta(t,full){if(t.meta&&!full)return{};const r=await tags(t.file,full);t.meta=1;if(r.title)t.title=r.title;if(r.artist)t.artist=r.artist;if(r.album)t.album=r.album;if(r.no)t.no=r.no;return r}
let bg=0;async function bgMeta(){const id=++bg;loading=true;const ui=()=>{if(kind==='library'&&!inAlbum)fillList()};
  for(let k=0;k<lib.length;k++){if(!lib[k].meta){await meta(lib[k]);if(id!==bg)return;if(k%300===299)ui()}}loading=false;ui()}

/* Biblioteca */
function ingest(items){
  const lrcs=new Map(),seen=new Set(lib.map(t=>t.key));let n=0;
  items.forEach(i=>{if(/\.lrc$/i.test(i.path))lrcs.set(i.path.replace(/\.lrc$/i,'').toLowerCase(),i.file)});
  const art=new Map(),dr=p=>p.slice(0,p.lastIndexOf('/')+1);
  items.forEach(i=>{if(IMG.test(i.path)){const d=dr(i.path);if(!art.has(d)||/^(cover|folder|front|album|albumart)/i.test(i.file.name))art.set(d,i.file)}});
  for(const i of items){if(!(AUD.test(i.path)||i.file.type.startsWith('audio/')))continue;const key=i.path+'|'+i.file.size;if(seen.has(key))continue;seen.add(key);
    const sg=i.path.split('/'),base=i.file.name.replace(/\.[^.]+$/,''),m=base.match(/^(.+?)\s+-\s+(.+)$/);
    lib.push({key,file:i.file,path:i.path,title:m?m[2]:base,artist:m?m[1]:(sg.length>3?sg[sg.length-3]:'Artista desconocido'),album:sg.length>2?sg[sg.length-2]:'Sin álbum',dir:dr(i.path),no:0,art:art.get(dr(i.path))||art.get(dr(dr(i.path).slice(0,-1))),lrc:lrcs.get(i.path.replace(/\.[^.]+$/,'').toLowerCase())});n++}
  lib.sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));return n}
function order(first){let q=base.slice();if(shuffle){for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[q[i],q[j]]=[q[j],q[i]]}if(first){q=q.filter(t=>t!==first);q.unshift(first)}}queue=q;idx=Math.max(0,q.indexOf(first))}
function play(tracks,first,mix){base=tracks.slice();shuffle=!!mix;paint();order(first);load(idx)}
function done(){bgMeta();if(kind==='library')showLibrary()}
async function walk(h,p,out){for await(const[n,e]of h.entries()){if(e.kind==='directory')await walk(e,p+n+'/',out);else if(AUD.test(n)||IMG.test(n)||/\.lrc$/i.test(n))out.push({file:await e.getFile(),path:p+n})}}
async function scan(hs){const out=[];for(const h of hs){try{await walk(h,h.name+'/',out)}catch{}}const n=ingest(out);done();return n}
async function addFolder(){
  if(!window.showDirectoryPicker)return inD.click();
  try{const h=await showDirectoryPicker({id:'musica',startIn:'music'});
    for(const d of dirs)if(await d.isSameEntry(h))return note('Esa carpeta ya está agregada.');
    dirs.push(h);kv('put','dirs',dirs);note('Escaneando carpeta…');const n=await scan([h]);note(n+' canciones nuevas agregadas.')}
  catch(e){if(e.name!=='AbortError')inD.click()}}
async function reconnect(){const ok=[];for(const h of pending)try{if(await h.requestPermission({mode:'read'})==='granted')ok.push(h)}catch{}
  pending=pending.filter(h=>!ok.includes(h));note('Escaneando…');const n=await scan(ok);note(n+' canciones cargadas.')}
function forget(){audio.pause();audio.removeAttribute('src');audio.load();lib=[];queue=[];base=[];idx=-1;dirs=[];pending=[];kv('put','dirs',[]);
  $('trackTitle').textContent=$('trackArtist').textContent='--';$('timeStart').textContent=$('timeEnd').textContent='--:--';$('progressBar').style.width='0';setCover();showLibrary()}
const mk=d=>{const i=document.createElement('input');i.type='file';i.multiple=true;if(d)i.webkitdirectory=true;else i.accept='audio/*,image/*,.lrc,.flac,.opus,.m4a';
  i.onchange=()=>{const f=[...i.files];i.value='';const n=ingest(f.map(x=>({file:x,path:x.webkitRelativePath||x.name})));done();note(n+' canciones agregadas. Este navegador no las recordará al cerrar.')};return i};
const inF=mk(0),inD=mk(1);

/* Reproducción */
function setCover(b){if(coverUrl)URL.revokeObjectURL(coverUrl);coverUrl=b?URL.createObjectURL(b):null;$('albumCover').src=coverUrl||PH;anim($('albumCover'),'cov')}
async function setLyrics(t,txt){let text=txt||'';if(t.lrc)try{text=await t.lrc.text()}catch{}if(queue[idx]!==t)return;
  const L=[];text.split(/\r?\n/).forEach(l=>{const s=l.replace(/\[[^\]]*\]/g,'').trim();[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)].forEach(m=>L.push({t:+m[1]*60+ +m[2],s}))});
  lyr={plain:text.trim(),synced:L.length?L.sort((a,b)=>a.t-b.t):null}}
async function load(i,play=true){
  if(i<0||i>=queue.length)return;idx=i;const t=queue[i],r=await meta(t,true);if(queue[idx]!==t)return;
  if(srcUrl)URL.revokeObjectURL(srcUrl);srcUrl=URL.createObjectURL(t.file);audio.src=srcUrl;
  $('trackTitle').textContent=$('trackTitle').title=t.title;$('trackArtist').textContent=t.artist+(t.album?' · '+t.album:'');anim($('trackTitle'),'txt');anim($('trackArtist'),'txt');document.title=t.title+' – '+t.artist;
  setCover(r.cover||t.art);if(play)audio.play().catch(()=>{});
  if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:coverUrl?[{src:coverUrl}]:[]});
  await setLyrics(t,r.lyrics);refresh()}
const toggle=()=>{if(!queue.length)return showLibrary();audio.paused?audio.play().catch(()=>{}):audio.pause()};
function next(manual){if(!queue.length)return;if(repeat===2&&!manual){audio.currentTime=0;return audio.play()}
  let i=idx+1;if(i>=queue.length){if(repeat===1||manual)i=0;else{audio.pause();audio.currentTime=0;return}}load(i)}
const prev=()=>{if(audio.currentTime>3||idx<=0)audio.currentTime=0;else load(idx-1)};
$('playBtn').onclick=toggle;$('nextBtn').onclick=()=>next(true);$('prevBtn').onclick=prev;
const paint=()=>{$('btnShuffle').classList.toggle('on',shuffle);const r=$('btnRepeat');r.textContent=repeat===2?'repeat_one':'repeat';r.classList.toggle('on',repeat>0)};paint();
$('btnShuffle').onclick=()=>{shuffle=!shuffle;paint();if(queue.length){order(queue[idx]);refresh()}};
$('btnRepeat').onclick=()=>{repeat=(repeat+1)%3;ls.set('rep',repeat);paint()};
let wl;async function wake(on){try{if(on&&!wl){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>wl=null}else if(!on&&wl){wl.release();wl=null}}catch{}}
audio.onplay=audio.onpause=()=>{const p=!audio.paused,b=$('playBtn');document.body.classList.toggle('playing',p);anim(b,'pop');b.textContent=p?'pause':'play_arrow';b.setAttribute('aria-label',p?'Pausar':'Reproducir');wake(p)};
audio.onplaying=()=>errs=0;audio.onended=()=>next(false);audio.onerror=()=>{if(audio.getAttribute('src')&&++errs<5)setTimeout(()=>next(true),400)};
audio.ontimeupdate=()=>{const d=audio.duration;$('progressBar').style.width=(d?audio.currentTime/d*100:0)+'%';$('timeStart').textContent=fmt(audio.currentTime);sync()};
audio.onloadedmetadata=()=>{$('timeEnd').textContent=fmt(audio.duration);try{navigator.mediaSession.setPositionState({duration:audio.duration,position:0})}catch{}};
document.onvisibilitychange=()=>{if(!document.hidden&&!audio.paused){wl=null;wake(true)}};
if('mediaSession'in navigator)[['play',()=>audio.play()],['pause',()=>audio.pause()],['previoustrack',prev],['nexttrack',()=>next(true)],['seekto',e=>audio.currentTime=e.seekTime]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}});
const bar=$('seekBar');let drag=false;
const seek=e=>{const r=bar.getBoundingClientRect();if(audio.duration)audio.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*audio.duration};
bar.onpointerdown=e=>{drag=true;bar.setPointerCapture(e.pointerId);seek(e)};bar.onpointermove=e=>drag&&seek(e);bar.onpointerup=bar.onpointercancel=()=>drag=false;

/* Pantalla completa (sin distracciones) */
async function fs(){try{if(document.fullscreenElement)await document.exitFullscreen();else{await document.documentElement.requestFullscreen({navigationUI:'hide'});screen.orientation?.lock?.('landscape').catch(()=>{})}}catch{}}
$('fsBtn').onclick=fs;document.onfullscreenchange=()=>$('fsBtn').textContent=document.fullscreenElement?'fullscreen_exit':'fullscreen';
addEventListener('click',e=>{if(e.target.id!=='fsBtn'&&!document.fullscreenElement&&document.fullscreenEnabled)fs()},{once:true,capture:true});

/* Accesibilidad y atajos */
document.querySelectorAll('.icon-btn').forEach(b=>{b.setAttribute('role','button');b.tabIndex=0});
addEventListener('keydown',e=>{const k=e.key,t=e.target;
  if(t.matches('input'))return;
  if((k==='Enter'||k===' ')&&t.classList.contains('icon-btn')){e.preventDefault();return t.click()}
  if(t.matches('button'))return;
  if(k==='Escape'&&kind)closeModal();else if(k===' '){e.preventDefault();toggle()}
  else if(k==='ArrowRight')audio.currentTime+=5;else if(k==='ArrowLeft')audio.currentTime-=5;
  else if(k==='n')next(true);else if(k==='p')prev();else if(k==='f')fs();else if(k==='l')showLyrics()});

['pointermove','pointerdown'].forEach(v=>addEventListener(v,e=>{const g=e.target.closest?.('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}},{passive:true}));

/* Colores según la portada */
function updateUIColors(img){
  let cs=[[31,90,153],[42,127,176],[85,70,168]],avg=[15,44,74];
  try{const x=document.createElement('canvas').getContext('2d',{willReadFrequently:true});x.canvas.width=x.canvas.height=32;x.drawImage(img,0,0,32,32);
    const d=x.getImageData(0,0,32,32).data,bk=new Map();let R=0,G=0,B=0,n=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const r=d[i],g=d[i+1],b=d[i+2];R+=r;G+=g;B+=b;n++;const q=(r>>5)<<6|(g>>5)<<3|(b>>5),e=bk.get(q)||{n:0,r:0,g:0,b:0};e.n++;e.r+=r;e.g+=g;e.b+=b;bk.set(q,e)}
    if(n){avg=[R/n|0,G/n|0,B/n|0];
      const l=[...bk.values()].map(e=>{const c=[e.r/e.n|0,e.g/e.n|0,e.b/e.n|0],mx=Math.max(...c),mn=Math.min(...c);return{c,s:e.n*(.25+(mx-mn)/255)*(mx>40?1:.2)}}).sort((a,b)=>b.s-a.s),p=[];
      for(const e of l){if(p.every(q=>Math.abs(q[0]-e.c[0])+Math.abs(q[1]-e.c[1])+Math.abs(q[2]-e.c[2])>90))p.push(e.c);if(p.length===3)break}
      while(p.length<3)p.push(p.length===1?p[0].map(v=>Math.min(255,v*1.4+25)):p[0].map(v=>v*.6));cs=p}}catch{}
  const s=document.documentElement.style,m=v=>Math.floor(v*.45),vv=c=>{const a=(c[0]+c[1]+c[2])/3;return c.map(v=>Math.max(0,Math.min(255,Math.round(a+(v-a)*1.25))))};
  cs.map(vv).forEach((c,i)=>s.setProperty('--c'+(i+1),`rgb(${c})`));
  s.setProperty('--bg-color-1',`rgb(${m(avg[0])},${m(avg[1])},${m(avg[2])})`);
  s.setProperty('--bg-color-2',`rgb(${Math.max(0,m(avg[0])-25)},${Math.max(0,m(avg[1])-25)},${Math.max(0,m(avg[2])-25)})`);
  s.setProperty('--glass-tint',`rgba(${avg},.22)`);s.setProperty('--glow-color',`rgba(${vv(cs[0])},.6)`)}
$('albumCover').addEventListener('load',function(){updateUIColors(this)});$('albumCover').src=PH;

/* Arranque: reabre carpetas guardadas */
(async()=>{dirs=(await kv('get','dirs'))||[];const ok=[];
  for(const h of dirs){try{(await h.queryPermission({mode:'read'}))==='granted'?ok.push(h):pending.push(h)}catch{pending.push(h)}}
  showLibrary();if(ok.length){note('Leyendo carpetas…');await scan(ok)}})();
